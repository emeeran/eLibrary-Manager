<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - eLibrary Manager</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #1a1a2e;
        }
        .login-card {
            background: #16213e;
            border-radius: 12px;
            padding: 40px;
            width: 360px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .login-card h1 {
            color: #e0e0e0;
            font-size: 24px;
            margin-bottom: 8px;
            text-align: center;
        }
        .login-card p {
            color: #888;
            font-size: 14px;
            margin-bottom: 24px;
            text-align: center;
        }
        .login-card input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #0f3460;
            color: #e0e0e0;
            font-size: 16px;
            margin-bottom: 16px;
            box-sizing: border-box;
        }
        .login-card input:focus {
            border-color: #533483;
        }
        .login-card input:focus-visible,
        .login-card button:focus-visible {
            outline: 2px solid #8b5cf6;
            outline-offset: 2px;
        }
        .login-card button {
            width: 100%;
            padding: 12px;
            background: #533483;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .login-card button:hover {
            background: #6a44a0;
        }
        .login-error {
            color: #ff6b6b;
            font-size: 14px;
            text-align: center;
            margin-top: 12px;
            display: none;
        }
        .password-wrap {
            position: relative;
        }
        .password-wrap input {
            padding-right: 44px;
        }
        .login-card .password-toggle {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: auto;
            padding: 6px;
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            line-height: 0;
            border-radius: 6px;
        }
        .login-card .password-toggle:hover {
            background: transparent;
            color: #e0e0e0;
        }
        .caps-hint {
            display: none;
            color: #f59e0b;
            font-size: 12px;
            margin: -10px 0 12px;
        }
        .caps-hint.visible {
            display: block;
        }
    </style>
    <link rel="icon" href="/static/images/dawnstar-mark.svg" type="image/svg+xml"/>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <img src="/static/images/dawnstar-logo-light.svg" alt="Dawnstar - eBook Library &amp; Viewer"
                 style="width:min(320px,80%);height:auto;margin-bottom:8px;"/>
            <h1>eLibrary Manager</h1>
            <p>Enter your password to continue</p>
            <form id="loginForm" onsubmit="return handleLogin(event)">
                <div class="password-wrap">
                    <input type="password" id="password" placeholder="Password" autocomplete="current-password" autofocus required
                           onkeydown="updateCapsHint(event)" onkeyup="updateCapsHint(event)">
                    <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password" aria-pressed="false" onclick="togglePasswordVisibility()">
                        <svg id="eyeOpen" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                        </svg>
                        <svg id="eyeOff" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="display:none;">
                            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                            <path d="M3.5 2.5l18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>
                </div>
                <span class="caps-hint" id="capsHint" aria-live="polite"></span>
                <button type="submit">Sign In</button>
            </form>
            <div class="login-error" id="loginError" role="alert">Invalid password</div>
        </div>
    </div>
    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('loginError');
            errorEl.style.display = 'none';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({password})
                });
                if (res.ok) {
                    // Honor ?next= deep links (spec 014 default-viewer), but only
                    // same-origin relative paths — never an absolute/protocol URL.
                    const next = new URLSearchParams(window.location.search).get('next');
                    window.location.href = next && next.startsWith('/') && !next.startsWith('//') ? next : '/';
                } else {
                    errorEl.style.display = 'block';
                    document.getElementById('password').value = '';
                    document.getElementById('password').focus();
                }
            } catch (err) {
                errorEl.textContent = 'Connection error';
                errorEl.style.display = 'block';
            }
            return false;
        }

        function togglePasswordVisibility() {
            const input = document.getElementById('password');
            const btn = document.getElementById('passwordToggle');
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            document.getElementById('eyeOpen').style.display = show ? 'none' : '';
            document.getElementById('eyeOff').style.display = show ? '' : 'none';
            btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
            btn.setAttribute('aria-pressed', String(show));
            input.focus();
        }

        function updateCapsHint(e) {
            const on = !!(e.getModifierState && e.getModifierState('CapsLock'));
            const hint = document.getElementById('capsHint');
            // Text goes in while visible so the polite live region announces it.
            hint.textContent = on ? 'Caps Lock is on' : '';
            hint.classList.toggle('visible', on);
        }
    </script>
</body>
</html>
